<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مفاجأتي إلك ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#160d18;color:#fff;font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden}
#scene{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
#particles{position:absolute;inset:0;pointer-events:none}.particle{position:absolute;user-select:none;touch-action:none;cursor:grab;animation:float 3s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-5px) rotate(-8deg)}to{transform:translateY(8px) rotate(8deg)}}
.content{position:relative;z-index:2;width:min(900px,100%)}h1{font-size:clamp(28px,5vw,44px);margin:0 0 22px}p{font-size:clamp(19px,3vw,25px);line-height:1.8}
button{border:0;border-radius:14px;padding:14px 26px;margin:12px;background:#ffb6c1;color:#25101c;font-size:20px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.97)}.letter{background:#fff0f5;color:#54213b;min-height:100vh;padding:18px}.letter h2{color:#9b2455}.letterbox{max-width:850px;margin:18px auto;background:white;border-radius:16px;padding:22px;text-align:right;white-space:pre-wrap;line-height:1.9;font-size:18px;max-height:70vh;overflow:auto}
.hidden{display:none}
</style>
</head>
<body>
<div id="scene">
 <div id="particles"></div>
 <main class="content" id="content">
  <h1>هل انتي فتومتي؟ ❤️</h1>
  <button id="yes">اييي ❤️</button>
 </main>
</div>
<script>
const stickers=["❤️","💗","💕","💖","🌹","🌷","💐","أحبج","أريدج","🥰"];
const colors=["#ffb6c1","#ff69b4","#ffffff","#ffd1dc"];
const layer=document.getElementById("particles"), content=document.getElementById("content"), scene=document.getElementById("scene");
let timer=null;
function makeParticles(n){layer.innerHTML="";for(let i=0;i<n;i++){const el=document.createElement("span");el.className="particle";el.textContent=stickers[Math.floor(Math.random()*stickers.length)];el.style.color=colors[Math.floor(Math.random()*colors.length)];el.style.fontSize=(17+Math.random()*13)+"px";el.style.left=Math.random()*94+"%";el.style.top=Math.random()*90+"%";el.style.animationDelay=(Math.random()*3)+"s";layer.appendChild(el);
let drag=false,dx=0,dy=0;el.addEventListener("pointerdown",e=>{drag=true;el.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top});el.addEventListener("pointermove",e=>{if(!drag)return;const p=scene.getBoundingClientRect();el.style.left=(e.clientX-p.left-dx)+"px";el.style.top=(e.clientY-p.top-dy)+"px"});el.addEventListener("pointerup",()=>drag=false);}}
function showStart(){clearTimeout(timer);makeParticles(45);content.innerHTML='<h1>هل انتي فتومتي؟ ❤️</h1><button id="yes">اييي ❤️</button>';document.getElementById("yes").onclick=showLove;}
function showLove(){makeParticles(65);content.innerHTML='<h1>أحبج هواية ❤️🌹</h1><p>أريدج تبقين فرحتي دائماً 💗</p>';timer=setTimeout(showStickers,30000);}
function showStickers(){makeParticles(75);content.innerHTML='<h1>إنتِ أحلى حكاية ❤️</h1><p>المسي القلوب والورود وحركيها 🌹</p><button id="open">افتح رسالتي ❤️</button>';document.getElementById("open").onclick=showLetter;}
function buildLetter(){let s="إلى أحلى إنسانة بحياتي ❤️🌹\n\nأريدج تعرفين شكد وجودج يفرحني، وشكد كلامج وابتسامتج يخلّون يومي أحلى.\n\nأتمنى تبقين دائماً بخير وراحة بال، وتتحقق كل أمنياتج.\n\nيمكن ما أعرف أوصف كل اللي بداخلي بالكلام، بس أعرف إنج شخص عزيز وغالي، وأتمنى أكون سبب ابتسامة وفرحة إلج.\n\nالله يحفظج ويسعد قلبج، ويبعد عنج كل حزن وتعب، ويرزقج أيام حلوة على قد طيبة قلبج.\n\n"+("والله احبج ❤️💞\n").repeat(100)+"\n";for(let i=101;i<=200;i++)s+=i+". والله أموت عليج ❤️\n";return s+"\nكل عام وإنتِ فرحتي، وكل يوم وإنتِ بخير. ❤️🌹";}
function showLetter(){clearTimeout(timer);layer.innerHTML="";scene.style.display="none";document.body.innerHTML='<main class="letter"><h2>💐 رسالة من القلب إلك 💐</h2><div class="letterbox" id="letter"></div><button id="back">رجوع للقلوب ❤️</button></main>';document.getElementById("letter").textContent=buildLetter();document.getElementById("back").onclick=()=>location.reload();}
showStart();
</script>
</body></html>
